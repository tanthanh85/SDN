  <text x="78" y="360" class="text">Macro VN: Corp or Contractor</text>
  <text x="78" y="386" class="text">Micro: SGT by user/device group</text>
  <rect x="390" y="84" width="220" height="350" rx="14" class="policy"/><text x="420" y="124" class="title">ISE and AD</text>
  <rect x="430" y="165" width="140" height="56" rx="8" class="policy"/><text x="500" y="198" text-anchor="middle" class="small">AD group lookup</text>
  <rect x="430" y="255" width="140" height="56" rx="8" class="policy"/><text x="500" y="288" text-anchor="middle" class="small">ISE authorization</text>
