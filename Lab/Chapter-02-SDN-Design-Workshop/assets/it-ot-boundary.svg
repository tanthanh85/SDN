  <rect x="1008" y="250" width="120" height="54" rx="8" class="policy"/><text x="1068" y="282" text-anchor="middle" class="small">Historian</text>
  <rect x="1150" y="250" width="78" height="54" rx="8" class="policy"/><text x="1189" y="282" text-anchor="middle" class="small">Jump</text>
