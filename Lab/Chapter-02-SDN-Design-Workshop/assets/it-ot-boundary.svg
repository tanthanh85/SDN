<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">IT OT boundary and identity policy design</title>
  <desc id="desc">Identity, SGT assignment, macro segmentation, and controlled IT OT boundary for the design workshop.</desc>
  <defs>
    <style>.it{fill:#f7fbff;stroke:#245a88;stroke-width:3}.wan{fill:#eef8f1;stroke:#287a44;stroke-width:3}.ot{fill:#fff7e8;stroke:#b06a00;stroke-width:3}.policy{fill:#fff;stroke:#245a88;stroke-width:2}.guard{fill:#fff4f2;stroke:#b42318;stroke-width:2}.line{stroke:#245a88;stroke-width:3;fill:none}.green{stroke:#287a44;stroke-width:3;fill:none}.title{font:700 24px Arial;fill:#142033}.text{font:15px Arial;fill:#18324a}.small{font:13px Arial;fill:#18324a}</style>
  </defs>
  <rect width="1320" height="520" fill="#eef3f7"/>
  <text x="36" y="44" class="title">Identity and IT/OT Segmentation Design View</text>
  <rect x="48" y="84" width="285" height="350" rx="14" class="it"/><text x="78" y="124" class="title">Campus IT</text>
