<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" role="img" aria-labelledby="title desc">
  <title id="title">PetroVale Chapter 2 target SDN design direction</title>
  <desc id="desc">Target domains showing ACI for data center, SD-WAN for WAN, SD-Access and ISE for campus identity policy.</desc>
  <defs>
    <style>.band{fill:#f7fbff;stroke:#245a88;stroke-width:3}.wan{fill:#eef8f1;stroke:#287a44;stroke-width:3}.id{fill:#fff7e8;stroke:#b06a00;stroke-width:3}.box{fill:#fff;stroke:#245a88;stroke-width:2}.line{stroke:#245a88;stroke-width:3;fill:none}.green{stroke:#287a44;stroke-width:3;fill:none}.title{font:700 25px Arial;fill:#142033}.text{font:15px Arial;fill:#18324a}.small{font:13px Arial;fill:#18324a}</style>
  </defs>
  <rect width="1320" height="560" fill="#eef3f7"/>
  <text x="36" y="44" class="title">Chapter 2 Target Design Direction</text>
  <rect x="48" y="90" width="290" height="340" rx="14" class="band"/>
  <text x="78" y="132" class="title">Data Center</text>
  <text x="78" y="160" class="text">Cisco ACI</text>
  <rect x="82" y="192" width="92" height="50" rx="8" class="box"/><text x="128" y="222" text-anchor="middle" class="small">APIC</text>
  <rect x="212" y="192" width="92" height="50" rx="8" class="box"/><text x="258" y="222" text-anchor="middle" class="small">Spines</text>
  <rect x="82" y="278" width="92" height="50" rx="8" class="box"/><text x="128" y="308" text-anchor="middle" class="small">Leafs</text>
  <rect x="212" y="278" width="92" height="50" rx="8" class="box"/><text x="258" y="308" text-anchor="middle" class="small">EPGs</text>
  <path d="M174 217 H212" class="line"/><path d="M258 242 V278" class="line"/><path d="M212 303 H174" class="line"/>
  <text x="78" y="374" class="text">1 tenant, 2 VRFs: Corp and Contractor</text>
  <text x="78" y="400" class="text">L3Out to routed and firewall boundaries</text>
  <rect x="395" y="90" width="260" height="340" rx="14" class="wan"/>
  <text x="425" y="132" class="title">WAN</text>
  <text x="425" y="160" class="text">Cisco SD-WAN</text>
  <rect x="430" y="204" width="92" height="50" rx="8" class="box"/><text x="476" y="234" text-anchor="middle" class="small">Edge</text>
  <rect x="530" y="178" width="92" height="50" rx="8" class="box"/><text x="576" y="208" text-anchor="middle" class="small">MPLS 1</text>
  <rect x="530" y="262" width="92" height="50" rx="8" class="box"/><text x="576" y="292" text-anchor="middle" class="small">MPLS 2</text>
  <path d="M522 228 L530 203" class="green"/><path d="M522 230 L530 287" class="green"/>
  <text x="425" y="374" class="text">2 virtual networks: Corp and Contractor</text>
  <text x="425" y="400" class="text">Application-aware routing and OSPF coexistence</text>
  <rect x="715" y="90" width="290" height="340" rx="14" class="band"/>
  <text x="745" y="132" class="title">Campus</text>
  <text x="745" y="160" class="text">Cisco SD-Access</text>
  <rect x="750" y="196" width="105" height="52" rx="8" class="box"/><text x="802" y="227" text-anchor="middle" class="small">Fabric Edge</text>
  <rect x="870" y="196" width="105" height="52" rx="8" class="box"/><text x="922" y="227" text-anchor="middle" class="small">Border/CP</text>
  <rect x="750" y="282" width="105" height="52" rx="8" class="box"/><text x="802" y="313" text-anchor="middle" class="small">Catalyst Ctr</text>
  <rect x="870" y="282" width="105" height="52" rx="8" class="box"/><text x="922" y="313" text-anchor="middle" class="small">ISE</text>
  <path d="M855 222 H870" class="line"/><path d="M802 282 V248" class="line"/><path d="M922 282 V248" class="line"/>
  <text x="745" y="374" class="text">Macro: Corp and Contractor VNs</text>
  <text x="745" y="400" class="text">Micro: SGT per user and device group</text>
  <rect x="1062" y="90" width="210" height="340" rx="14" class="id"/>
  <text x="1092" y="132" class="title">Identity</text>
  <text x="1092" y="160" class="text">ISE, AD, SGT</text>
  <rect x="1096" y="204" width="130" height="50" rx="8" class="box"/><text x="1161" y="234" text-anchor="middle" class="small">802.1X users</text>
  <rect x="1096" y="280" width="130" height="50" rx="8" class="box"/><text x="1161" y="310" text-anchor="middle" class="small">MAC IoT phase 1</text>
  <text x="1092" y="374" class="text">AD group to ISE policy</text>
  <text x="1092" y="400" class="text">SGT used for enforcement design</text>
  <path d="M338 260 H395" class="line"/><path d="M655 260 H715" class="line"/><path d="M1005 260 H1062" class="line"/>
</svg>
