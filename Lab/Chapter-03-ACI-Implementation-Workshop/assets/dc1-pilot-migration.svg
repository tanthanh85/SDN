<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">DC1 two-VLAN pilot migration topology</title>
  <desc id="desc">Legacy core and ACI fabric coexist through temporary Layer 2 trunks and separate eBGP Layer 3 links.</desc>
  <defs>
    <style>.zone{stroke:#8fb5d3;stroke-width:3;rx:14}.legacy{fill:#edf6fc}.aci{fill:#eef8f1}.transit{fill:#f7f2e8}.l2{stroke:#2c6fb0;stroke-width:5;fill:none}.l3{stroke:#2f7d4a;stroke-width:5;fill:none}.device{fill:#fff;stroke:#245a88;stroke-width:4}.t{font:700 29px Arial;fill:#18324a}.label{font:600 21px Arial;fill:#18324a;text-anchor:middle}.link{font:700 18px Arial;fill:#18324a;text-anchor:middle}.note{font:600 19px Arial;fill:#18324a}</style>
    <symbol id="switch" viewBox="0 0 100 70"><rect class="device" x="3" y="4" width="94" height="62" rx="12"/><path d="M24 22h52M18 33h64" stroke="#245a88" stroke-width="4" stroke-linecap="round"/><g fill="#d9e8f5" stroke="#245a88" stroke-width="2"><rect x="18" y="47" width="12" height="9"/><rect x="38" y="47" width="12" height="9"/><rect x="58" y="47" width="12" height="9"/><rect x="78" y="47" width="12" height="9"/></g></symbol>
    <symbol id="router" viewBox="0 0 90 90"><circle class="device" cx="45" cy="45" r="39"/><path d="M22 45h46M30 31L16 45l14 14M60 31l14 14-14 14" stroke="#245a88" stroke-width="4" fill="none"/></symbol>
    <symbol id="server" viewBox="0 0 75 95"><rect class="device" x="5" y="4" width="65" height="87" rx="8"/><path d="M5 33h65M5 61h65" stroke="#245a88" stroke-width="3"/><circle cx="58" cy="19" r="5" fill="#247a3b"/><circle cx="58" cy="47" r="5" fill="#247a3b"/><circle cx="58" cy="75" r="5" fill="#247a3b"/></symbol>
  </defs>
  <rect width="1600" height="820" fill="#f8fbfe"/>
  <text x="50" y="55" class="t">DC1 pilot migration: preserved subnets with controlled coexistence</text>
  <rect x="40" y="90" width="520" height="620" class="zone legacy"/><rect x="590" y="90" width="300" height="620" class="zone transit"/><rect x="920" y="90" width="640" height="620" class="zone aci"/>
  <text x="70" y="140" class="t">Legacy data center</text><text x="620" y="140" class="t">Coexistence boundary</text><text x="950" y="140" class="t">Cisco ACI fabric</text>
  <path class="l2" d="M300 270L1030 270M300 500L1030 500"/>
  <path class="l3" d="M300 270L730 390L1030 500M300 500L730 390L1030 270"/>
  <path class="l3" d="M1030 270L1270 210M1030 270L1270 430M1030 500L1270 210M1030 500L1270 430"/>
  <path class="l2" d="M300 270L190 640M300 500L190 640M1270 210L1400 620M1270 430L1400 620"/>
  <use href="#switch" x="250" y="235" width="100" height="70"/><use href="#switch" x="250" y="465" width="100" height="70"/>
  <text x="300" y="340" class="label">Legacy core 1</text><text x="300" y="570" class="label">Legacy core 2</text>
  <use href="#server" x="153" y="595" width="75" height="95"/><text x="190" y="735" class="label">Pilot workloads</text>
  <use href="#router" x="685" y="345" width="90" height="90"/><text x="730" y="470" class="label">External routing pair</text>
  <use href="#switch" x="980" y="235" width="100" height="70"/><use href="#switch" x="980" y="465" width="100" height="70"/>
  <text x="1030" y="340" class="label">Border leaf 1</text><text x="1030" y="570" class="label">Border leaf 2</text>
  <use href="#switch" x="1220" y="175" width="100" height="70"/><use href="#switch" x="1220" y="395" width="100" height="70"/>
  <text x="1270" y="280" class="label">Spine 1</text><text x="1270" y="500" class="label">Spine 2</text>
  <use href="#server" x="1363" y="575" width="75" height="95"/><text x="1400" y="715" class="label">Migrated workloads</text>
  <rect x="480" y="235" width="260" height="38" rx="5" fill="#fff" stroke="#2c6fb0" stroke-width="2"/><text x="610" y="261" class="link">Temporary 802.1Q trunks</text>
  <rect x="560" y="365" width="330" height="45" rx="5" fill="#fff" stroke="#2f7d4a" stroke-width="2"/><text x="725" y="394" class="link">Separate eBGP routed coexistence</text>
  <text x="70" y="780" class="note">Blue: Layer 2 subnet preservation</text><text x="470" y="780" class="note">Green: Layer 3 eBGP reachability</text><text x="900" y="780" class="note">Gateway ownership transfers one VLAN at a time</text>
</svg>
