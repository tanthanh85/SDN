  <rect x="715" y="244" width="150" height="54" rx="8" class="policy"/><text x="790" y="276" text-anchor="middle" class="small">ACI VRFs/EPGs</text>
  <text x="705" y="360" class="text">Corp and Contractor separation</text>
  <text x="705" y="386" class="text">SGT-aware enforcement where supported</text>
